services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage
    environment:
      - LLM_PROVIDER=mock
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173
  web:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      - VITE_API_BASE=http://localhost:8000
